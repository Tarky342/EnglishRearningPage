<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0d1928">
    <meta name="description" content="第一コンピュータリソースの英語一般教養に向けた非公式・独自作成の学習アプリ。365問、短時間演習、間隔反復、模試、学習分析。">
    <link rel="stylesheet" href="./assets/tutor-ui.css">
    <title>DCR English Lab — 英語試験対策</title>
    <style>
        :root {
            --bg: #f5f7fa;
            --surface: #fff;
            --surface2: #f9fafc;
            --ink: #1b2b3d;
            --ink2: #53667b;
            --muted: #7f90a1;
            --line: #e4eaf0;
            --navy: #0d1928;
            --navy2: #182a40;
            --teal: #009c90;
            --teal2: #dff7f3;
            --blue: #2b67bb;
            --blue2: #e8f0ff;
            --orange: #c07a17;
            --orange2: #fff4e3;
            --red: #be4a50;
            --red2: #ffedef;
            --radius: 16px;
            --shadow: 0 8px 28px rgba(17, 35, 55, .045)
        }

        * {
            box-sizing: border-box
        }

        html {
            scroll-behavior: smooth
        }

        body {
            margin: 0;
            font-family: Inter, "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif;
            color: var(--ink);
            background: var(--bg);
            font-size: 14px;
            line-height: 1.6
        }

        button,
        input,
        select {
            font: inherit
        }

        button {
            cursor: pointer
        }

        button:disabled {
            cursor: not-allowed;
            opacity: .5
        }

        a {
            color: var(--blue)
        }

        button:focus-visible,
        a:focus-visible,
        select:focus-visible {
            outline: 3px solid #63c6c3;
            outline-offset: 2px
        }

        h1,
        h2,
        h3,
        p {
            margin-top: 0
        }

        .app {
            display: grid;
            grid-template-columns: 246px minmax(0, 1fr);
            min-height: 100vh
        }

        .side {
            background: var(--navy);
            color: #c5d2de;
            padding: 27px 17px 20px;
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto
        }

        .brand {
            padding: 0 15px 27px;
            border-bottom: 1px solid #2a3b4d;
            margin-bottom: 17px
        }

        .brand-mark {
            display: flex;
            gap: 10px;
            align-items: center;
            font-size: 18px;
            font-weight: 850;
            letter-spacing: -.4px;
            color: #fff;
            white-space: nowrap
        }

        .brand-icon {
            height: 33px;
            width: 33px;
            display: grid;
            place-items: center;
            border-radius: 10px;
            background: #0ea99a;
            color: white;
            font-size: 14px;
            font-weight: 900
        }

        .brand-sub {
            font-size: 10px;
            letter-spacing: 1.25px;
            color: #a5b7c8;
            margin-top: 7px
        }

        .side-label {
            font-size: 10px;
            color: #778ea5;
            letter-spacing: 1.5px;
            font-weight: 800;
            padding: 12px 13px 8px
        }

        .nav {
            display: flex;
            flex-direction: column;
            gap: 4px
        }

        .navbtn {
            width: 100%;
            display: flex;
            gap: 12px;
            align-items: center;
            background: transparent;
            border: 0;
            text-align: left;
            padding: 11px 14px;
            border-radius: 10px;
            color: #aebdce;
            font-weight: 700
        }

        .navbtn.active {
            background: #193c4a;
            color: #78eddf
        }

        .navbtn:hover:not(.active) {
            background: #1b2e42;
            color: #fff
        }

        .navico {
            width: 20px;
            display: inline-block;
            text-align: center;
            font-size: 17px
        }

        .side-bottom {
            margin-top: auto;
            padding: 22px 11px 0;
            border-top: 1px solid #2a3b4d;
            font-size: 11px;
            color: #a6b5c4
        }

        .progress-track {
            height: 7px;
            background: #314252;
            border-radius: 20px;
            overflow: hidden;
            margin: 9px 0
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #2ac1b4, #75e4d7);
            width: 0
        }

        .side-foot {
            font-size: 10px;
            line-height: 1.8;
            color: #8193a5;
            margin-top: 14px
        }

        .main {
            min-width: 0
        }

        .topbar {
            height: 78px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 43px;
            border-bottom: 1px solid var(--line);
            background: rgba(255, 255, 255, .88);
            position: sticky;
            top: 0;
            z-index: 7;
            backdrop-filter: blur(9px)
        }

        .eyebrow {
            font-size: 11px;
            letter-spacing: 1.35px;
            font-weight: 800;
            color: var(--teal);
            text-transform: uppercase
        }

        .topbar-title {
            font-size: 16px;
            font-weight: 850;
            letter-spacing: -.3px
        }

        .topright {
            display: flex;
            align-items: center;
            gap: 12px
        }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border-radius: 100px;
            padding: 5px 10px;
            font-size: 11px;
            font-weight: 750;
            background: #f0f4f7;
            color: #607386;
            white-space: nowrap
        }

        .pill.good {
            background: var(--teal2);
            color: #007c72
        }

        .pill.warn {
            background: var(--orange2);
            color: #91590e
        }

        .pill.danger {
            background: var(--red2);
            color: var(--red)
        }

        .content {
            max-width: 1280px;
            padding: 35px 43px 80px;
            margin: auto
        }

        .page-head {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            align-items: flex-end;
            margin-bottom: 24px
        }

        .page-head h1 {
            font-size: 29px;
            letter-spacing: -1.25px;
            margin: 4px 0 5px;
            line-height: 1.35
        }

        .sub {
            color: var(--ink2);
            font-size: 13px;
            max-width: 760px;
            margin: 0
        }

        .grid {
            display: grid;
            gap: 16px
        }

        .g4 {
            grid-template-columns: repeat(4, minmax(0, 1fr))
        }

        .g3 {
            grid-template-columns: repeat(3, minmax(0, 1fr))
        }

        .g2 {
            grid-template-columns: repeat(2, minmax(0, 1fr))
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px
        }

        .card.slim {
            padding: 19px
        }

        .card h2 {
            font-size: 17px;
            letter-spacing: -.4px;
            margin: 0 0 8px
        }

        .card h3 {
            font-size: 14px;
            margin: 0 0 7px
        }

        .stat-label {
            font-size: 11px;
            font-weight: 750;
            color: var(--ink2)
        }

        .stat {
            font-size: 30px;
            letter-spacing: -1.4px;
            font-weight: 850;
            line-height: 1.25;
            margin-top: 8px
        }

        .stat-detail {
            color: var(--muted);
            font-size: 11px;
            margin-top: 4px
        }

        .accent {
            color: var(--teal)
        }

        .hero {
            border-radius: 21px;
            padding: 34px 36px;
            color: #fff;
            background: linear-gradient(115deg, #0f2033, #183e47);
            position: relative;
            overflow: hidden;
            display: grid;
            grid-template-columns: minmax(0, 1.3fr) minmax(170px, .7fr);
            gap: 20px;
            margin-bottom: 21px
        }

        .hero:before {
            content: "";
            position: absolute;
            width: 310px;
            height: 310px;
            right: -45px;
            top: -75px;
            border: 1px solid rgba(104, 224, 210, .2);
            border-radius: 100%
        }

        .hero:after {
            content: "";
            position: absolute;
            width: 230px;
            height: 230px;
            right: -8px;
            top: -30px;
            border: 1px solid rgba(104, 224, 210, .18);
            border-radius: 100%
        }

        .hero .eyebrow {
            color: #73e9da
        }

        .hero h1 {
            font-size: 30px;
            letter-spacing: -1.2px;
            line-height: 1.4;
            max-width: 620px;
            margin: 7px 0 12px
        }

        .hero p {
            color: #bfd0de;
            font-size: 13px;
            margin-bottom: 20px;
            max-width: 580px
        }

        .hero-metric {
            position: relative;
            z-index: 1;
            align-self: center;
            text-align: center
        }

        .hero-metric .big {
            font-size: 58px;
            font-weight: 850;
            letter-spacing: -2px;
            line-height: 1
        }

        .hero-metric small {
            color: #a9c4ca
        }

        .actions {
            display: flex;
            gap: 9px;
            flex-wrap: wrap
        }

        .btn {
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 10px 15px;
            background: #fff;
            color: var(--ink);
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            min-height: 42px;
            transition: transform .1s, background .12s, border-color .12s
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-1px);
            border-color: #b2c7d0
        }

        .btn.primary {
            background: var(--teal);
            border-color: var(--teal);
            color: white
        }

        .btn.primary:hover {
            background: #008c82
        }

        .btn.dark {
            background: #fff;
            color: #0c4947;
            border-color: #fff
        }

        .btn.dark2 {
            background: transparent;
            border-color: #577a82;
            color: #e9ffff
        }

        .btn.ghost {
            background: transparent
        }

        .btn.danger {
            color: #a83b42;
            border-color: #f1ced1
        }

        .btn.small {
            padding: 6px 11px;
            min-height: 34px;
            font-size: 12px
        }

        .btn.full {
            width: 100%
        }

        .btn:disabled {
            transform: none
        }

        .card-sub {
            font-size: 12px;
            color: var(--muted);
            margin-top: 4px
        }

        .sec-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 13px
        }

        .sec-title h2 {
            margin: 0;
            font-size: 18px
        }

        .cycle-list {
            display: grid;
            gap: 10px;
            margin-top: 17px
        }

        .cycle-item {
            display: flex;
            gap: 12px;
            align-items: center;
            border: 1px solid var(--line);
            padding: 11px 13px;
            border-radius: 12px
        }

        .cycle-num {
            width: 29px;
            height: 29px;
            flex: none;
            border-radius: 9px;
            background: var(--teal2);
            color: var(--teal);
            font-weight: 900;
            display: grid;
            place-items: center;
            font-size: 12px
        }

        .cycle-item strong {
            font-size: 12px
        }

        .cycle-item small {
            display: block;
            color: var(--muted);
            font-size: 11px
        }

        .cycle-item button {
            margin-left: auto
        }

        .bar-list {
            display: grid;
            gap: 15px;
            margin-top: 13px
        }

        .bar-row {
            display: grid;
            grid-template-columns: 120px 1fr 42px;
            gap: 11px;
            align-items: center;
            font-size: 12px
        }

        .bar {
            height: 8px;
            background: #edf1f5;
            border-radius: 20px;
            overflow: hidden
        }

        .bar>div {
            background: var(--teal);
            height: 100%;
            border-radius: 20px
        }

        .bar>div.low {
            background: #e8a34d
        }

        .bar-row>strong {
            text-align: right
        }

        .chip {
            display: inline-flex;
            align-items: center;
            border-radius: 6px;
            padding: 3px 7px;
            background: #eff4f8;
            color: #536579;
            font-size: 10px;
            font-weight: 750
        }

        .chip.level3 {
            background: #fff3e5;
            color: #b16b1c
        }

        .chip.level1 {
            background: #e9f6f2;
            color: #178275
        }

        .stack {
            display: flex;
            flex-wrap: wrap;
            gap: 7px
        }

        .muted {
            color: var(--muted)
        }

        .highlight {
            color: var(--teal);
            font-weight: 800
        }

        .tip {
            font-size: 12px;
            color: #45596d;
            background: #edf5f5;
            border-left: 3px solid #24ab9d;
            padding: 12px 15px;
            border-radius: 0 9px 9px 0
        }

        .notice {
            font-size: 11px;
            color: var(--ink2);
            padding: 12px 15px;
            background: #f3f6f9;
            border-radius: 9px;
            border: 1px solid var(--line)
        }

        .list {
            display: grid;
            gap: 9px
        }

        .rowline {
            padding: 10px 0;
            border-bottom: 1px solid var(--line);
            display: flex;
            gap: 9px;
            justify-content: space-between;
            align-items: center
        }

        .rowline:last-child {
            border: 0
        }

        .right {
            text-align: right
        }

        .empty {
            padding: 34px 18px;
            text-align: center;
            border: 1px dashed #cfdae5;
            border-radius: 13px;
            background: #fafcfd;
            color: var(--ink2)
        }

        .empty strong {
            display: block;
            color: var(--ink);
            font-size: 15px;
            margin-bottom: 5px
        }

        .course-card {
            display: flex;
            flex-direction: column;
            gap: 8px
        }

        .course-card .count {
            font-size: 11px;
            color: var(--muted)
        }

        .course-card .rule {
            font-size: 12px;
            color: var(--ink2);
            min-height: 59px
        }

        .course-card .bottom {
            margin-top: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px
        }

        .lesson-panel {
            border: 1px solid #cbe7e3;
            background: #f8fefd;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 19px
        }

        .lesson-panel h2 {
            font-size: 20px;
            margin: 6px 0 12px
        }

        .lesson-rule {
            font-size: 15px;
            line-height: 1.9;
            font-weight: 700;
            color: #213e45
        }

        .lesson-example {
            padding: 14px 17px;
            border-radius: 10px;
            background: #fff;
            border: 1px solid #d6e8e7;
            margin: 13px 0
        }

        .lesson-example b {
            display: block;
            font-size: 15px;
            color: #0a7269;
            margin-bottom: 2px
        }

        .lesson-note {
            font-size: 12px;
            margin-top: 12px;
            color: #62542d;
            background: #fff7e5;
            padding: 12px 14px;
            border-radius: 8px
        }

        .inline-actions {
            display: flex;
            gap: 9px;
            align-items: center;
            flex-wrap: wrap
        }

        .tabstrip {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin: 0 0 19px
        }

        .tab {
            border: 1px solid var(--line);
            background: white;
            color: var(--ink2);
            padding: 8px 12px;
            border-radius: 9px;
            font-size: 12px;
            font-weight: 750
        }

        .tab.active {
            border-color: var(--teal);
            background: var(--teal2);
            color: #057d74
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            align-items: end;
            gap: 13px
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 12px;
            font-weight: 750;
            color: var(--ink2)
        }

        .field select,
        .field input {
            min-width: 126px;
            border: 1px solid #d4dee7;
            background: white;
            border-radius: 9px;
            padding: 10px 11px;
            color: var(--ink)
        }

        .focus-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 13px
        }

        .choice-card {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 13px;
            padding: 20px
        }

        .choice-card .label {
            color: var(--muted);
            font-size: 11px;
            font-weight: 700
        }

        .choice-card h3 {
            font-size: 16px;
            margin: 6px 0
        }

        .choice-card p {
            color: var(--ink2);
            font-size: 12px;
            min-height: 39px
        }

        .choice-card .btn {
            width: 100%
        }

        .session-wrap {
            max-width: 890px;
            margin: auto
        }

        .session-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 17px
        }

        .timer {
            padding: 9px 14px;
            border-radius: 11px;
            border: 1px solid #d7e2e7;
            background: white;
            font-size: 17px;
            font-variant-numeric: tabular-nums;
            font-weight: 850;
            letter-spacing: 1px
        }

        .timer.urgent {
            background: var(--red2);
            border-color: #efbdc1;
            color: var(--red)
        }

        .q-card {
            padding: 29px 33px
        }

        .q-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 20px
        }

        .question {
            font-size: 23px;
            font-weight: 800;
            line-height: 1.6;
            letter-spacing: -.3px;
            margin: 10px 0 23px;
            word-break: normal
        }

        .passage {
            background: #f7f9fc;
            border: 1px solid #e6edf3;
            border-radius: 12px;
            padding: 20px 22px;
            color: #34495c;
            line-height: 1.9;
            font-size: 14px;
            white-space: pre-wrap
        }

        .options {
            display: grid;
            gap: 10px
        }

        .option {
            min-height: 57px;
            width: 100%;
            display: flex;
            gap: 13px;
            align-items: center;
            text-align: left;
            padding: 12px 17px;
            background: #fff;
            border: 1.5px solid #dce6ef;
            border-radius: 11px;
            color: #213246;
            font-weight: 650
        }

        .option:not(:disabled):hover {
            border-color: #58bdb4;
            background: #f2fbfa
        }

        .option.selected {
            border-color: var(--blue);
            background: var(--blue2)
        }

        .option.correct {
            border-color: #16a597;
            background: #e7f9f5;
            color: #087b70
        }

        .option.incorrect {
            border-color: #d46b6b;
            background: #fff0f0;
            color: #a83c44
        }

        .option:disabled {
            opacity: 1;
            cursor: default
        }

        .letter {
            width: 27px;
            height: 27px;
            flex: none;
            background: #edf2f6;
            border-radius: 7px;
            display: grid;
            place-items: center;
            font-size: 12px;
            font-weight: 850
        }

        .option.correct .letter {
            background: #abeee4
        }

        .option.incorrect .letter {
            background: #ffd9dc
        }

        .answer-feedback {
            margin-top: 17px;
            padding: 17px;
            border: 1px solid #b6e5da;
            border-radius: 12px;
            background: #f0fbf8
        }

        .answer-feedback.bad {
            border-color: #f1c7b4;
            background: #fff8f1
        }

        .feedback-title {
            font-weight: 850;
            margin-bottom: 4px
        }

        .feedback-desc {
            font-size: 13px;
            color: #344b58;
            line-height: 1.9
        }

        .q-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 9px;
            margin-top: 19px;
            flex-wrap: wrap
        }

        .qhint {
            color: var(--muted);
            font-size: 11px
        }

        .progress-wide {
            height: 7px;
            background: #e9eff3;
            border-radius: 5px;
            margin: 14px 0 17px;
            overflow: hidden
        }

        .progress-wide>div {
            height: 100%;
            background: var(--teal);
            transition: width .2s
        }

        .result-score {
            display: flex;
            gap: 30px;
            align-items: center;
            flex-wrap: wrap;
            margin: 13px 0 22px
        }

        .result-score .big {
            font-size: 57px;
            font-weight: 900;
            color: var(--teal);
            line-height: 1
        }

        .result-score .big.low {
            color: var(--orange)
        }

        .result-score span {
            font-size: 12px;
            color: var(--muted)
        }

        .result-list {
            display: grid;
            gap: 10px
        }

        .result-item {
            padding: 15px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: #fff
        }

        .result-item .result-stem {
            font-weight: 750;
            margin: 5px 0
        }

        .result-item .explain {
            font-size: 12px;
            color: var(--ink2)
        }

        .result-item .answerline {
            font-size: 12px;
            margin-bottom: 7px
        }

        .chart {
            height: 175px;
            display: flex;
            align-items: end;
            justify-content: space-around;
            gap: 9px;
            padding-top: 20px
        }

        .chartcol {
            display: flex;
            align-items: center;
            justify-content: end;
            flex-direction: column;
            gap: 6px;
            flex: 1;
            height: 100%;

    <script>
        'use strict';
        const BANK = __DATA__;

        const CAT = Object.fromEntries(CATS.map(c => [c.id, c]));
        const STORE_KEY = 'dcr-english-lab-v1';
        const GUIDE = {
            agreement: { title: '単数主語にだけ -s を付ける', example: 'Each employee needs an ID card.', meaning: '各従業員はIDカードを必要とします。', trap: 'everyone / each / the number of は原則単数扱い。', check: 'one of my friends の主語の核は one。' },
            tense: { title: '時間を示す語から時制を一発で選ぶ', example: 'We updated the server yesterday.', meaning: '私たちは昨日サーバーを更新しました。', trap: 'yesterday = 過去形。right now = 現在進行形。before + 過去 = 過去完了を検討。', check: 'last Friday → 過去形、at the moment → 現在進行形。' },
            perfect: { title: 'have/has + 過去分詞 = 過去と現在の接続', example: 'I have worked here since April.', meaning: '私は4月からここで働いています。', trap: 'since + 起点／for + 期間。have been / have seen 等の過去分詞に注意。', check: 'since 2024 / for two years。' },
            modal: { title: '助動詞の後ろは必ず動詞の原形', example: 'You must not share your password.', meaning: 'パスワードを共有してはいけません。', trap: 'must not = 禁止、do not have to = 義務なし。意味は全く異なる。', check: 'must do / should do / can do。' },
            passive: { title: '動作を「受ける」なら be + 過去分詞', example: 'The file was sent yesterday.', meaning: 'そのファイルは昨日送信されました。', trap: '過去：was/were + 過去分詞。助動詞：must be + 過去分詞。', check: 'The software is used worldwide. → 利用される側。' },
            gerund: { title: '動詞ごとに後続の形をセットで記憶', example: 'We look forward to hearing from you.', meaning: 'ご連絡をお待ちしています。', trap: 'enjoy/avoid/finish + -ing。want/decide/hope + to do。let/make + 人 + 原形。', check: 'look forward to の to は前置詞 → 動名詞。' },
            comparison: { title: 'than は比較級、as ～ as は原級', example: 'This system is faster than the old one.', meaning: 'このシステムは旧版より速いです。', trap: 'more difficult／the best／not as hard as の形を混同しない。', check: 'than → 比較級、the ～ of three → 最上級。' },
            relative: { title: '先行詞が人か物か、文の欠けを調べる', example: 'The engineer who called you is here.', meaning: 'あなたに電話した技術者がここにいます。', trap: '人 who、物 which/that、場所 where、所有 whose。', check: 'whose + 名詞、where + 主語 + 動詞。' },
            preposition: { title: '前置詞は意味ごとに1組で覚える', example: 'Please send it by Friday.', meaning: '金曜日までに送ってください。', trap: 'by = 期限、until = 継続。at 3 p.m.／on Monday／in April。', check: 'responsible for / interested in / reply to / attached to。' },
            conjunction: { title: '未来の if / when 節では現在形', example: 'If it rains, we will stay home.', meaning: '雨が降れば、家にいます。', trap: 'although + 文、despite + 名詞句、because + 文、because of + 名詞句。', check: 'If it will rain は通常不可。If it rains。' },
            article: { title: '名詞の数え方を見て冠詞を選ぶ', example: 'She is an engineer.', meaning: '彼女はエンジニアです。', trap: 'information / advice / water は不可算。an hour は発音が母音から始まる。', check: 'three boxes / a little time / a few books。' },

            conditional: { title: '現実の条件か、事実に反する仮定か', example: 'If I had more time, I would study.', meaning: 'もっと時間があれば勉強するのに。', trap: '実現可能：if + 現在形, will。非現実：if + 過去形, would。', check: 'If I were you, I would ～ は頻出パターン。' },

            reading: { title: '設問の「誰・いつ・何・なぜ」を探す', example: 'Requests submitted by 3 p.m. will be processed today.', meaning: '午後3時までの申請は本日処理されます。', trap: 'instead of / however / from ～ / by ～ に注意。日付・数字・変更点が狙われやすい。', check: '最初に設問→該当箇所を探す→選択肢を照合する。' }

        let state = loadState(), view = 'home', selectedCategory = null, lessonFilter = 'all', session = null, lastResult = null, ticker = null, flashTimeout = null;
        function defaults() { return { profiles: {}, sessions: [], settings: { dailyTarget: 40, autoReinforce: true }, created: Date.now() } }
        function loadState() { try { const v = JSON.parse(localStorage.getItem(STORE_KEY)); if (!v || typeof v !== 'object' || !v.profiles) return defaults(); return { ...defaults(), ...v, settings: { ...defaults().settings, ...(v.settings || {}) } } } catch (e) { return defaults() } }

        function h(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])) }

        function dueQuestions() { const t = Date.now(); return QS.filter(q => { const p = pOf(q.id); return p && p.due <= t }) }
        function wrongQuestions() { return QS.filter(q => { const p = pOf(q.id); return p && p.wrong > 0 }) }
        function profileStats() { const ps = Object.values(state.profiles), seen = ps.length, answers = ps.reduce((a, p) => a + p.seen, 0), correct = ps.reduce((a, p) => a + p.correct, 0), today = ps.reduce((a, p) => a + ((p.byDay || {})[localDate(Date.now())] || 0), 0); return { seen, answers, correct, accuracy: answers ? Math.round(100 * correct / answers) : 0, today, due: dueQuestions().length } }
        function categoryStats(cat) { const qs = QS.filter(q => q.cat === cat), ps = qs.map(q => pOf(q.id)).filter(Boolean), answers = ps.reduce((a, p) => a + p.seen, 0), correct = ps.reduce((a, p) => a + p.correct, 0), wrong = ps.reduce((a, p) => a + p.wrong, 0); return { total: qs.length, seen: ps.length, answers, correct, wrong, accuracy: answers ? Math.round(100 * correct / answers) : null } }
        function weakCategories() { return CATS.map(c => ({ ...c, ...categoryStats(c.id) })).sort((a, b) => ((a.accuracy ?? 45) + a.seen * .13) - ((b.accuracy ?? 45) + b.seen * .13)) }
        function profileUpdate(q, ok, ms) { const now = Date.now(), key = localDate(now); let p = state.profiles[q.id] || { seen: 0, correct: 0, wrong: 0, streak: 0, ease: 2.5, interval: 0, due: 0, avgMs: 0, last: 0, byDay: {} }; p.seen++; p.last = now; p.byDay = p.byDay || {}; p.byDay[key] = (p.byDay[key] || 0) + 1; p.avgMs = Math.round(((p.avgMs || 0) * (p.seen - 1) + ms) / p.seen); if (ok) { p.correct++; p.streak++; p.interval = p.streak === 1 ? 1 : p.streak === 2 ? 3 : Math.min(120, Math.max(4, Math.round((p.interval || 3) * p.ease))); p.ease = Math.min(3.1, p.ease + .08); p.due = now + p.interval * 86400000 } else { p.wrong++; p.streak = 0; p.interval = 0; p.ease = Math.max(1.3, p.ease - .18); p.due = now + 10 * 60000 } state.profiles[q.id] = p; persist() }
        function toast(msg) { const root = document.getElementById('toast-root'); root.innerHTML = `<div class="toast" role="status">${h(msg)}</div>`; clearTimeout(flashTimeout); flashTimeout = setTimeout(() => root.innerHTML = '', 2800) }

        function home() {
            const s = profileStats(), weak = weakCategories(), recent = state.sessions.slice(-3).reverse(); const readiness = readinessScore(); return `<div class="hero"><div class="hero-main"><div class="eyebrow">TODAY'S LEARNING · ${QS.length} QUESTIONS</div><h1>${s.due ? `復習する${s.due}問から、今日の学習を始めよう。` : '今日も5分、<br>英語力を伸ばそう。'}</h1><p>${s.due ? '復習のタイミングが来た問題があります。まずは記憶を確認しましょう。' : '今のレベルに合わせて出題します。最初は5分・10問から始めましょう。'}</p><div class="actions"><button class="btn dark" data-action="start" data-mode="${s.due ? 'review' : 'sprint'}">${s.due ? `▶ 復習を始める（${Math.min(s.due,20)}問）` : '▶ 5分で学習を始める'}</button><button class="btn dark2" data-action="start" data-mode="weak">弱点を練習</button></div><div class="hero-note"><span>今日の学習</span><strong>${s.today} / ${state.settings.dailyTarget}問</strong><div class="hero-track" role="progressbar" aria-label="今日の学習目標" aria-valuemin="0" aria-valuemax="${state.settings.dailyTarget}" aria-valuenow="${Math.min(s.today,state.settings.dailyTarget)}"><span style="width:${Math.min(100,s.today/state.settings.dailyTarget*100)}%"></span></div></div></div><div class="hero-metric"><div class="big">${readiness}%</div><small>学習到達度（独自指標）</small><div class="hero-disclaimer">企業の合格判定ではありません</div></div></div>
<div class="grid g4" style="margin-bottom:21px"><div class="card slim"><div class="stat-label">総合正答率</div><div class="stat">${s.answers ? s.accuracy + '%' : '—'}</div><div class="stat-detail">${s.correct} / ${s.answers} 回答</div></div><div class="card slim"><div class="stat-label">学習した問題</div><div class="stat">${s.seen}<span style="font-size:14px;color:var(--muted)"> / ${QS.length}</span></div><div class="stat-detail">収録問題のカバー率 ${round(s.seen / QS.length * 100)}%</div></div><div class="card slim"><div class="stat-label">現在の復習対象</div><div class="stat accent">${s.due}<span style="font-size:14px">問</span></div><div class="stat-detail">復習時刻が到来した問題</div></div><div class="card slim"><div class="stat-label">今日の学習量</div><div class="stat">${s.today}<span style="font-size:14px;color:var(--muted)"> / ${state.settings.dailyTarget}</span></div><div class="stat-detail">今日の目標まで ${Math.max(0, state.settings.dailyTarget - s.today)} 回答</div></div></div>
<div class="grid g2"><section class="card"><div class="sec-title"><h2>高速ルーティン</h2><span class="chip">推奨順</span></div><p class="card-sub">考える時間を減らし、演習→補強→再確認を1サイクルに。</p><div class="cycle-list"><div class="cycle-item"><span class="cycle-num">01</span><span><strong>高密度インプット</strong><small>苦手なルールを1〜3分で確認</small></span><button class="btn small" data-action="nav" data-view="learn">見る</button></div><div class="cycle-item"><span class="cycle-num">02</span><span><strong>5分スプリント</strong><small>10問を素早く解き、即座に採点</small></span><button class="btn small" data-action="start" data-mode="sprint">開始</button></div><div class="cycle-item"><span class="cycle-num">03</span><span><strong>弱点・間隔復習</strong><small>誤答と忘却予定を優先</small></span><button class="btn small" data-action="nav" data-view="review">確認</button></div><div class="cycle-item"><span class="cycle-num">04</span><span><strong>実戦模試</strong><small>時間制限・解説非表示で実戦化</small></span><button class="btn small" data-action="nav" data-view="mock">開始</button></div></div></section>

        function drill() { const s = profileStats(), weak = weakCategories(); return `${heading('高速アウトプット', '解答直後に根拠を確認し、同じ弱点の問題を追加。数字キー 1〜4、Enter で高速操作できます。', '02 / ACTIVE RECALL')}<div class="focus-grid"><section class="choice-card"><div class="label">STANDARD SPRINT</div><h3>5分・10問</h3><p>まずは全分野を素早く確認。迷う問題を浮かび上がらせる。</p><button class="btn primary" data-action="start" data-mode="sprint">▶ 開始</button></section><section class="choice-card"><div class="label">INTENSIVE</div><h3>12分・20問</h3><p>密度重視。短時間で広く触れ、正答率を安定させる。</p><button class="btn primary" data-action="start" data-mode="intensive">▶ 開始</button></section><section class="choice-card"><div class="label">ADAPTIVE</div><h3>弱点集中・12問</h3><p>過去の誤答率・回答速度・復習期限に基づき自動で出題。</p><button class="btn primary" data-action="start" data-mode="weak">▶ 開始</button></section></div><section class="card" style="margin-top:18px"><h2>分野指定ドリル</h2><p class="card-sub">分野ごとの問題を集中的に解く。初回は全体学習も組み合わせると効果的です。</p><div class="controls" style="margin-top:15px"><label class="field">分野<select id="focus-cat">${CATS.map(c => `<option value="${c.id}">${h(c.name)} (${categoryStats(c.id).total}問)</option>`).join('')}</select></label><label class="field">問題数<select id="focus-count"><option value="8">8問</option><option value="12" selected>12問</option><option value="20">20問</option></select></label><button class="btn primary" data-action="start-focus-select">この分野で開始</button></div></section><div class="grid g2" style="margin-top:18px"><section class="card"><h2>優先分野 TOP 5</h2>${weak.slice(0, 5).map(c => `<div class="rowline"><span>${h(c.name)}<small class="muted"> · ${c.seen}問学習</small></span><span class="inline-actions"><span class="chip">${c.accuracy === null ? '未学習' : c.accuracy + '%'}</span><button class="btn small" data-action="start" data-mode="focus" data-cat="${c.id}">演習</button></span></div>`).join('')}</section><section class="card"><h2>復習の仕組み</h2><p class="card-sub">不正解の問題は10分後の復習対象へ。正解を重ねると1日→3日→より長い間隔へ自動調整します。</p><div class="tip">ドリル中の不正解には、同分野の別問題を最大8問まで追加して即時補強します。</div><p class="study-footnote">※間隔と優先度は本アプリ独自の簡易アルゴリズムです。期限と解答速度も出題優先度に反映します。</p></section></div>${infoFooter()}` }
        function review() { const due = dueQuestions().sort((a, b) => pOf(a.id).due - pOf(b.id).due), wrong = wrongQuestions().sort((a, b) => pOf(b.id).last - pOf(a.id).last); return `${heading('忘れる前に、取り戻す。', '誤答の直後は理解を優先し、10分後・翌日以降は思い出す練習で定着させます。', '03 / SPACED REPETITION')}<div class="grid g3" style="margin-bottom:18px"><div class="card slim"><div class="stat-label">今、復習できる</div><div class="stat accent">${due.length}<small style="font-size:13px">問</small></div></div><div class="card slim"><div class="stat-label">過去に誤答した問題</div><div class="stat">${wrong.length}<small style="font-size:13px">問</small></div></div><div class="card slim"><div class="stat-label">復習予定（今後7日）</div><div class="stat">${QS.filter(q => { const p = pOf(q.id); return p && p.due > Date.now() && p.due <= Date.now() + 7 * 86400000 }).length}<small style="font-size:13px">問</small></div></div></div><div class="grid g2"><section class="card"><h2>予定済みの復習</h2><p class="card-sub">期限を過ぎた問題から優先。予定が0件なら、間違えた問題を任意に復習できます。</p>${due.length ? `<div class="notice" style="margin:14px 0">先頭から最大20問を出題します。正答すると次の復習日が更新されます。</div><button class="btn primary full" data-action="start" data-mode="review">▶ 復習を始める（${Math.min(20, due.length)}問）</button>` : `<div class="empty" style="margin:16px 0"><strong>期限到来の問題はありません</strong>現在の復習予定はすべて完了しています。</div>`}<button class="btn full" data-action="start" data-mode="mistakes" ${wrong.length ? '' : 'disabled'} style="margin-top:10px">過去の誤答から再挑戦</button></section><section class="card"><h2>直近の誤答</h2>${wrong.length ? wrong.slice(0, 8).map(q => `<div class="rowline"><div style="max-width:82%"><div style="font-size:11px;color:var(--muted)">${h(CAT[q.cat].name)} · ${shortDate(pOf(q.id).last)}</div><div style="font-size:12px;font-weight:700">${h(q.stem)}</div></div><span class="chip">${pOf(q.id).wrong}ミス</span></div>`).join('') : '<div class="empty"><strong>誤答履歴なし</strong>ドリルを解くとここに蓄積されます。</div>'}</section></div><div class="notice" style="margin-top:18px">学習データはこのブラウザ内だけに保存されます。別端末へ移す場合は「設         }
        function exportData() { const payload = { app: 'DCR English Lab', version: 1, exportedAt: new Date().toISOString(), data: state }, blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' }), u = URL.createObjectURL(blob), a = document.createElement('a'); a.href = u; a.download = `dcr-english-progress-${localDate(Date.now())}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(u), 2000); toast('学習データを書き出しました。') }
        async function importData(file) { if (!file) return; try { if (file.size > 3_000_000) throw Error('ファイルが大きすぎます。'); const raw = JSON.parse(await file.text()); if (raw.app !== 'DCR English Lab' || raw.version !== 1 || !raw.data || typeof raw.data.profiles !== 'object' || !Array.isArray(raw.data.sessions)) throw Error('対応するバックアップ形式ではありません。'); const allowed = new Set(QS.map(q => q.id)), profiles = {}; for (const [key, v] of Object.entries(raw.data.profiles)) { if (!allowed.has(key) || !v || typeof v !== 'object') continue; const clean = { ...v }; for (const f of ['seen', 'correct', 'wrong', 'streak', 'ease', 'interval', 'due', 'avgMs', 'last']) clean[f] = Number(v[f]) || 0; clean.byDay = (v.byDay && typeof v.byDay === 'object') ? Object.fromEntries(Object.entries(v.byDay).filter(([k, z]) => /^\d{4}-\d{2}-\d{2}$/.test(k) && Number.isFinite(Number(z))).map(([k, z]) => [k, Math.max(0, Number(z))])) : {}; profiles[key] = clean } const ss = raw.data.sessions.filter(v => v && typeof v === 'object' && Number.isFinite(Number(v.at))).slice(-150).map(v => ({ mode: ['sprint', 'intensive', 'weak', 'focus', 'review', 'mistakes', 'mock'].includes(v.mode) ? v.mode : 'focus', at: Number(v.at) || 0, total: Math.max(0, Number(v.total) || 0), answered: Math.max(0, Number(v.answered) || 0), correct: Math.max(0, Number(v.correct) || 0), percent: Math.max(0, Math.min(100, Number(v.percent) || 0)), elapsed: Math.max(0, Number(v.elapsed) || 0), aborted: !!v.aborted })); const cfg = raw.data.settings || {}; const safeSettings = { dailyTarget: [20, 40, 60, 80, 100].includes(Number(cfg.dailyTarget)) ? Number(cfg.dailyTarget) : 40, autoReinforce: cfg.autoReinforce !== false }; showConfirm(`既存の学習履歴を上書きして、${Object.keys(profiles).length}問分のデータを復元しますか？`, () => { state = { ...defaults(), profiles, sessions: ss, settings: safeSettings }; persist(); render(); toast('学習履歴を復元しました。') }) } catch (e) { toast(`読み込み失敗：${e.message}`) } }
        function resetAll() { showConfirm('学習記録・正答率・復習予定をすべて削除します。バックアップ済みであることをご確認ください。', () => { state = defaults(); lastResult = null; session = null; clearInterval(ticker); persist(); navTo('home'); toast('学習履歴を初期化しました。') }) }
        document.addEventListener('click', e => { const b = e.target.closest('[data-action]'); if (!b) return; const a = b.dataset.action; switch (a) { case 'nav': closeMore(); navTo(b.dataset.view); break; case 'more-open': openMore(); break; case 'more-close': if (e.target === b || b.tagName === 'BUTTON') closeMore(); break; case 'lesson-filter': lessonFilter = b.dataset.filter; selectedCategory = null; render(); break; case 'lesson-open': selectedCategory = b.dataset.cat; render(); document.getElementById('lesson')?.scrollIntoView({ behavior: 'smooth', block: 'start' }); break; case 'lesson-close': selectedCategory = null; render(); break; case 'start': startSession(b.dataset.mode, b.dataset.cat || null, null, null); break; case 'start-focus-select': startSession('focus', document.getElementById('focus-cat').value, +document.getElementById('focus-count').value, null); break; case 'start-mock': startSession('mock', null, +document.getElementById('mock-count').value, +document.getElementById('mock-time').value); break; case 'choose': choose(+b.dataset.choice); break; case 'skip': choose(-1); break; case 'next': nextQuestion(); break; case 'stop': showConfirm('現在の回答までで採点し、演習を終了しますか？', () => finishSession(true)); break; case 'retry-misses': retryMisses(); break; case 'export': exportData(); break; case 'save-settings': state.settings.dailyTarget = +document.getElementById('daily-target').value; state.settings.autoReinforce = document.getElementById('auto-reinforce').value === 'on'; persist(); render(); toast('設定を保存しました。'); break; case 'reset': resetAll(); break; } });
        document.addEventListener('change', e => { if (e.target.id === 'import-file') { importData(e.target.files?.[0]); e.target.value = '' } });
        document.addEventListener('keydown', e => { if (!session || view !== 'play' || e.altKey || e.ctrlKey || e.metaKey || document.querySelector('#modal-root .modal')) return; if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName)) return; if (['1', '2', '3', '4'].includes(e.key) && session.selected === null) { choose(Number(e.key) - 1); e.preventDefault() } if (e.key === 'Enter' && session.selected !== null && !document.activeElement?.closest('button, a, [role=button]')) { nextQuestion(); e.preventDefault() } });
        document.addEventListener('keydown', e => {
            if (e.key !== 'Escape') return;
            if (document.getElementById('mobile-more')) { closeMore(); e.preventDefault(); return; }
            const cancel = document.querySelector('#modal-root [data-modal="cancel"]');
            if (cancel) { cancel.click(); e.preventDefault(); }
        });
        window.addEventListener('beforeunload', () => { if (session) persist() });
        render();
    </script>
    <script defer src="./assets/tutor-ui.js"></script>
