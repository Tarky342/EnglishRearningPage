<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d1928" />
    <meta
      name="description"
      content="英語一般教養に向けた非公式・独自作成の学習アプリ。365問、短時間演習、間隔反復、模試、学習分析。"
    />
    <title>英語試験対策</title>
    <style>
      :root {
        --bg: #f5f7fa;
        --surface: #fff;
        --surface2: #f9fafc;
        --ink: #1b2b3d;
        --ink2: #53667b;
        --muted: #7f90a1;
        --line: #e4eaf0;
        --navy: #0d1928;
        --navy2: #182a40;
        --teal: #009c90;
        --teal2: #dff7f3;
        --blue: #2b67bb;
        --blue2: #e8f0ff;
        --orange: #c07a17;
        --orange2: #fff4e3;
        --red: #be4a50;
        --red2: #ffedef;
        --radius: 16px;
        --shadow: 0 8px 28px rgba(17, 35, 55, 0.045);
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        font-family:
          Inter, "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic",
          Meiryo, sans-serif;
        color: var(--ink);
        background: var(--bg);
        font-size: 14px;
        line-height: 1.6;
      }

      button,
      input,
      select {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }

      a {
        color: var(--blue);
      }

      button:focus-visible,
      a:focus-visible,
      select:focus-visible {
        outline: 3px solid #63c6c3;
        outline-offset: 2px;
      }

      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }

      .app {
        display: grid;
        grid-template-columns: 246px minmax(0, 1fr);
        min-height: 100vh;
      }

      .side {
        background: var(--navy);
        color: #c5d2de;
        padding: 27px 17px 20px;
        display: flex;
        flex-direction: column;
        position: sticky;
        top: 0;
        height: 100vh;
        overflow-y: auto;
      }

      .brand {
        padding: 0 15px 27px;
        border-bottom: 1px solid #2a3b4d;
        margin-bottom: 17px;
      }

      .brand-mark {
        display: flex;
        gap: 10px;
        align-items: center;
        font-size: 18px;
        font-weight: 850;
        letter-spacing: -0.4px;
        color: #fff;
        white-space: nowrap;
      }

      .brand-icon {
        display: grid;
        place-items: center;
        border-radius: 10px;
        background: #0ea99a;
        color: white;
        font-size: 14px;
        font-weight: 900;
      }

      .brand-sub {
        font-size: 10px;
        letter-spacing: 1.25px;
        color: #a5b7c8;
        margin-top: 7px;
      }

      .side-label {
        font-size: 10px;
        color: #778ea5;
        letter-spacing: 1.5px;
        font-weight: 800;
        padding: 12px 13px 8px;
      }

      .nav {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .navbtn {
        width: 100%;
        display: flex;
        gap: 12px;
        align-items: center;
        background: transparent;
        border: 0;
        text-align: left;
        padding: 11px 14px;
        border-radius: 10px;
        color: #aebdce;
        font-weight: 700;
      }

      .navbtn.active {
        background: #193c4a;
        color: #78eddf;
      }

      .navbtn:hover:not(.active) {
        background: #1b2e42;
        color: #fff;
      }

      .navico {
        width: 20px;
        display: inline-block;
        text-align: center;
        font-size: 17px;
      }

      .side-bottom {
        margin-top: auto;
        padding: 22px 11px 0;
        border-top: 1px solid #2a3b4d;
        font-size: 11px;
        color: #a6b5c4;
      }

      .progress-track {
        height: 7px;
        background: #314252;
        border-radius: 20px;
        overflow: hidden;
        margin: 9px 0;
      }

      .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, #2ac1b4, #75e4d7);
        width: 0;
      }

      .side-foot {
        font-size: 10px;
        line-height: 1.8;
        color: #8193a5;
        margin-top: 14px;
      }

      .main {
        min-width: 0;
      }

      .topbar {
        height: 78px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 43px;
        border-bottom: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.88);
        position: sticky;
        top: 0;
        z-index: 7;
        backdrop-filter: blur(9px);
      }

      .eyebrow {
        font-size: 11px;
        letter-spacing: 1.35px;
        font-weight: 800;
        color: var(--teal);
        text-transform: uppercase;
      }

      .topbar-title {
        font-size: 16px;
        font-weight: 850;
        letter-spacing: -0.3px;
      }

      .topright {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border-radius: 100px;
        padding: 5px 10px;
        font-size: 11px;
        font-weight: 750;
        background: #f0f4f7;
        color: #607386;
        white-space: nowrap;
      }

      .pill.good {
        background: var(--teal2);
        color: #007c72;
      }

      .pill.warn {
        background: var(--orange2);
        color: #91590e;
      }

      .pill.danger {
        background: var(--red2);
        color: var(--red);
      }

      .content {
        max-width: 1280px;
        padding: 35px 43px 80px;
        margin: auto;
      }

      .page-head {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: flex-end;
        margin-bottom: 24px;
      }

      .page-head h1 {
        font-size: 29px;
        letter-spacing: -1.25px;
        margin: 4px 0 5px;
        line-height: 1.35;
      }

      .sub {
        color: var(--ink2);
        font-size: 13px;
        max-width: 760px;
        margin: 0;
      }

      .grid {
        display: grid;
        gap: 16px;
      }

      .g4 {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .g3 {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .g2 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 24px;
      }

      .card.slim {
        padding: 19px;
      }

      .card h2 {
        font-size: 17px;
        letter-spacing: -0.4px;
        margin: 0 0 8px;
      }

      .card h3 {
        font-size: 14px;
        margin: 0 0 7px;
      }

      .stat-label {
        font-size: 11px;
        font-weight: 750;
        color: var(--ink2);
      }

      .stat {
        font-size: 30px;
        letter-spacing: -1.4px;
        font-weight: 850;
        line-height: 1.25;
        margin-top: 8px;
      }

      .stat-detail {
        color: var(--muted);
        font-size: 11px;
        margin-top: 4px;
      }

      .accent {
        color: var(--teal);
      }

      .hero {
        border-radius: 21px;
        padding: 34px 36px;
        color: #fff;
        background: linear-gradient(115deg, #0f2033, #183e47);
        position: relative;
        overflow: hidden;
        display: grid;
        grid-template-columns: minmax(0, 1.3fr) minmax(170px, 0.7fr);
        gap: 20px;
        margin-bottom: 21px;
      }

      .hero:before {
        content: "";
        position: absolute;
        width: 310px;
        height: 310px;
        right: -45px;
        top: -75px;
        border: 1px solid rgba(104, 224, 210, 0.2);
        border-radius: 100%;
      }

      .hero:after {
        content: "";
        position: absolute;
        width: 230px;
        height: 230px;
        right: -8px;
        top: -30px;
        border: 1px solid rgba(104, 224, 210, 0.18);
        border-radius: 100%;
      }

      .hero .eyebrow {
        color: #73e9da;
      }

      .hero h1 {
        font-size: 30px;
        letter-spacing: -1.2px;
        line-height: 1.4;
        max-width: 620px;
        margin: 7px 0 12px;
      }

      .hero p {
        color: #bfd0de;
        font-size: 13px;
        margin-bottom: 20px;
        max-width: 580px;
      }

      .hero-metric {
        position: relative;
        z-index: 1;
        align-self: center;
        text-align: center;
      }

      .hero-metric .big {
        font-size: 58px;
        font-weight: 850;
        letter-spacing: -2px;
        line-height: 1;
      }

      .hero-metric small {
        color: #a9c4ca;
      }

      .actions {
        display: flex;
        gap: 9px;
        flex-wrap: wrap;
      }

      .btn {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 15px;
        background: #fff;
        color: var(--ink);
        font-weight: 800;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        min-height: 42px;
        transition:
          transform 0.1s,
          background 0.12s,
          border-color 0.12s;
      }

      .btn:hover:not(:disabled) {
        transform: translateY(-1px);
        border-color: #b2c7d0;
      }

      .btn.primary {
        background: var(--teal);
        border-color: var(--teal);
        color: white;
      }

      .btn.primary:hover {
        background: #008c82;
      }

      .btn.dark {
        background: #fff;
        color: #0c4947;
        border-color: #fff;
      }

      .btn.dark2 {
        background: transparent;
        border-color: #577a82;
        color: #e9ffff;
      }

      .btn.ghost {
        background: transparent;
      }

      .btn.danger {
        color: #a83b42;
        border-color: #f1ced1;
      }

      .btn.small {
        padding: 6px 11px;
        min-height: 34px;
        font-size: 12px;
      }

      .btn.full {
        width: 100%;
      }

      .btn:disabled {
        transform: none;
      }

      .card-sub {
        font-size: 12px;
        color: var(--muted);
        margin-top: 4px;
      }

      .sec-title {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 13px;
      }

      .sec-title h2 {
        margin: 0;
        font-size: 18px;
      }

      .cycle-list {
        display: grid;
        gap: 10px;
        margin-top: 17px;
      }

      .cycle-item {
        display: flex;
        gap: 12px;
        align-items: center;
        border: 1px solid var(--line);
        padding: 11px 13px;
        border-radius: 12px;
      }

      .cycle-num {
        width: 29px;
        height: 29px;
        flex: none;
        border-radius: 9px;
        background: var(--teal2);
        color: var(--teal);
        font-weight: 900;
        display: grid;
        place-items: center;
        font-size: 12px;
      }

      .cycle-item strong {
        font-size: 12px;
      }

      .cycle-item small {
        display: block;
        color: var(--muted);
        font-size: 11px;
      }

      .cycle-item button {
        margin-left: auto;
      }

      .bar-list {
        display: grid;
        gap: 15px;
        margin-top: 13px;
      }

      .bar-row {
        display: grid;
        grid-template-columns: 120px 1fr 42px;
        gap: 11px;
        align-items: center;
        font-size: 12px;
      }

      .bar {
        height: 8px;
        background: #edf1f5;
        border-radius: 20px;
        overflow: hidden;
      }

      .bar > div {
        background: var(--teal);
        height: 100%;
        border-radius: 20px;
      }

      .bar > div.low {
        background: #e8a34d;
      }

      .bar-row > strong {
        text-align: right;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        border-radius: 6px;
        padding: 3px 7px;
        background: #eff4f8;
        color: #536579;
        font-size: 10px;
        font-weight: 750;
      }

      .chip.level3 {
        background: #fff3e5;
        color: #b16b1c;
      }

      .chip.level1 {
        background: #e9f6f2;
        color: #178275;
      }

      .stack {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }

      .muted {
        color: var(--muted);
      }

      .highlight {
        color: var(--teal);
        font-weight: 800;
      }

      .tip {
        font-size: 12px;
        color: #45596d;
        background: #edf5f5;
        border-left: 3px solid #24ab9d;
        padding: 12px 15px;
        border-radius: 0 9px 9px 0;
      }

      .notice {
        font-size: 11px;
        color: var(--ink2);
        padding: 12px 15px;
        background: #f3f6f9;
        border-radius: 9px;
        border: 1px solid var(--line);
      }

      .list {
        display: grid;
        gap: 9px;
      }

      .rowline {
        padding: 10px 0;
        border-bottom: 1px solid var(--line);
        display: flex;
        gap: 9px;
        justify-content: space-between;
        align-items: center;
      }

      .rowline:last-child {
        border: 0;
      }

      .right {
        text-align: right;
      }

      .empty {
        padding: 34px 18px;
        text-align: center;
        border: 1px dashed #cfdae5;
        border-radius: 13px;
        background: #fafcfd;
        color: var(--ink2);
      }

      .empty strong {
        display: block;
        color: var(--ink);
        font-size: 15px;
        margin-bottom: 5px;
      }

      .course-card {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .course-card .count {
        font-size: 11px;
        color: var(--muted);
      }

      .course-card .rule {
        font-size: 12px;
        color: var(--ink2);
        min-height: 59px;
      }

      .course-card .bottom {
        margin-top: auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .lesson-panel {
        border: 1px solid #cbe7e3;
        background: #f8fefd;
        border-radius: 15px;
        padding: 25px;
        margin-bottom: 19px;
      }

      .lesson-panel h2 {
        font-size: 20px;
        margin: 6px 0 12px;
      }

      .lesson-rule {
        font-size: 15px;
        line-height: 1.9;
        font-weight: 700;
        color: #213e45;
      }

      .lesson-example {
        padding: 14px 17px;
        border-radius: 10px;
        background: #fff;
        border: 1px solid #d6e8e7;
        margin: 13px 0;
      }

      .lesson-example b {
        display: block;
        font-size: 15px;
        color: #0a7269;
        margin-bottom: 2px;
      }

      .lesson-note {
        font-size: 12px;
        margin-top: 12px;
        color: #62542d;
        background: #fff7e5;
        padding: 12px 14px;
        border-radius: 8px;
      }

      .inline-actions {
        display: flex;
        gap: 9px;
        align-items: center;
        flex-wrap: wrap;
      }

      .tabstrip {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin: 0 0 19px;
      }

      .tab {
        border: 1px solid var(--line);
        background: white;
        color: var(--ink2);
        padding: 8px 12px;
        border-radius: 9px;
        font-size: 12px;
        font-weight: 750;
      }

      .tab.active {
        border-color: var(--teal);
        background: var(--teal2);
        color: #057d74;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        align-items: end;
        gap: 13px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 12px;
        font-weight: 750;
        color: var(--ink2);
      }

      .field select,
      .field input {
        min-width: 126px;
        border: 1px solid #d4dee7;
        background: white;
        border-radius: 9px;
        padding: 10px 11px;
        color: var(--ink);
      }

      .focus-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 13px;
      }

      .choice-card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 13px;
        padding: 20px;
      }

      .choice-card .label {
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
      }

      .choice-card h3 {
        font-size: 16px;
        margin: 6px 0;
      }

      .choice-card p {
        color: var(--ink2);
        font-size: 12px;
        min-height: 39px;
      }

      .choice-card .btn {
        width: 100%;
      }

      .session-wrap {
        max-width: 890px;
        margin: auto;
      }

      .session-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 17px;
      }

      .timer {
        padding: 9px 14px;
        border-radius: 11px;
        border: 1px solid #d7e2e7;
        background: white;
        font-size: 17px;
        font-variant-numeric: tabular-nums;
        font-weight: 850;
        letter-spacing: 1px;
      }

      .timer.urgent {
        background: var(--red2);
        border-color: #efbdc1;
        color: var(--red);
      }

      .q-card {
        padding: 29px 33px;
      }

      .q-meta {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 20px;
      }

      .question {
        font-size: 23px;
        font-weight: 800;
        line-height: 1.6;
        letter-spacing: -0.3px;
        margin: 10px 0 23px;
        word-break: normal;
      }

      .passage {
        background: #f7f9fc;
        border: 1px solid #e6edf3;
        border-radius: 12px;
        padding: 20px 22px;
        color: #34495c;
        line-height: 1.9;
        font-size: 14px;
        white-space: pre-wrap;
      }

      .options {
        display: grid;
        gap: 10px;
      }

      .option {
        min-height: 57px;
        width: 100%;
        display: flex;
        gap: 13px;
        align-items: center;
        text-align: left;
        padding: 12px 17px;
        background: #fff;
        border: 1.5px solid #dce6ef;
        border-radius: 11px;
        color: #213246;
        font-weight: 650;
      }

      .option:not(:disabled):hover {
        border-color: #58bdb4;
        background: #f2fbfa;
      }

      .option.selected {
        border-color: var(--blue);
        background: var(--blue2);
      }

      .option.correct {
        border-color: #16a597;
        background: #e7f9f5;
        color: #087b70;
      }

      .option.incorrect {
        border-color: #d46b6b;
        background: #fff0f0;
        color: #a83c44;
      }

      .option:disabled {
        opacity: 1;
        cursor: default;
      }

      .letter {
        width: 27px;
        height: 27px;
        flex: none;
        background: #edf2f6;
        border-radius: 7px;
        display: grid;
        place-items: center;
        font-size: 12px;
        font-weight: 850;
      }

      .option.correct .letter {
        background: #abeee4;
      }

      .option.incorrect .letter {
        background: #ffd9dc;
      }

      .answer-feedback {
        margin-top: 17px;
        padding: 17px;
        border: 1px solid #b6e5da;
        border-radius: 12px;
        background: #f0fbf8;
      }

      .answer-feedback.bad {
        border-color: #f1c7b4;
        background: #fff8f1;
      }

      .feedback-title {
        font-weight: 850;
        margin-bottom: 4px;
      }

      .feedback-desc {
        font-size: 13px;
        color: #344b58;
        line-height: 1.9;
      }

      .q-bottom {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 9px;
        margin-top: 19px;
        flex-wrap: wrap;
      }

      .qhint {
        color: var(--muted);
        font-size: 11px;
      }

      .progress-wide {
        height: 7px;
        background: #e9eff3;
        border-radius: 5px;
        margin: 14px 0 17px;
        overflow: hidden;
      }

      .progress-wide > div {
        height: 100%;
        background: var(--teal);
        transition: width 0.2s;
      }

      .result-score {
        display: flex;
        gap: 30px;
        align-items: center;
        flex-wrap: wrap;
        margin: 13px 0 22px;
      }

      .result-score .big {
        font-size: 57px;
        font-weight: 900;
        color: var(--teal);
        line-height: 1;
      }

      .result-score .big.low {
        color: var(--orange);
      }

      .result-score span {
        font-size: 12px;
        color: var(--muted);
      }

      .result-list {
        display: grid;
        gap: 10px;
      }

      .result-item {
        padding: 15px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fff;
      }

      .result-item .result-stem {
        font-weight: 750;
        margin: 5px 0;
      }

      .result-item .explain {
        font-size: 12px;
        color: var(--ink2);
      }

      .result-item .answerline {
        font-size: 12px;

      "use strict";
      const BANK = {
        categories: [
          {
            id: "agreement",
            name: "主語と動詞",
            group: "文法",
            guide:
              "主語が三人称単数なら現在形に -s / -es。every day は現在形の目印。",
          },
          {
            id: "tense",
            name: "時制",
            group: "文法",
            guide:
              "yesterday / last ～ は過去形、now は進行形、tomorrow は未来を考える。",
          },
          {
            id: "perfect",
            name: "現在完了",
            group: "文法",
            guide: "have/has + 過去分詞。since は起点、for は期間。",
          },
          {
            id: "modal",
            name: "助動詞",
            group: "文法",
            guide:
              "助動詞の直後は動詞の原形。must not は禁止、do not have to は不要。",
          },
          {
            id: "passive",
            name: "受動態",
            group: "文法",
            guide:
              "be動詞 + 過去分詞で「～される」。主語が動作を受けるか判断する。",
          },
          {
            id: "gerund",
            name: "不定詞・動名詞",
            group: "文法",
            guide:
              "want to do、enjoy doing、look forward to doing など動詞ごとの型を覚える。",
          },
          {
            id: "comparison",
            name: "比較",
            group: "文法",
            guide: "than は比較級、the ～ in/of は最上級、as ～ as は原級。",
          },
          {
            id: "relative",
            name: "関係詞",
            group: "文法",
            guide:
              "人を説明する who/that、物を説明する which/that、場所の where。",
          },
          {
            id: "preposition",
            name: "前置詞",
            group: "文法",
            guide:
              "at は時刻、on は曜日、in は月・年。by は期限、until は継続。",
          },
          {
            id: "conjunction",
            name: "接続詞・条件",
            group: "文法",
            guide:
              "if/when の条件・時を表す節では、未来のことでも現在形を使う。",

            id: "article",

            group: "文法",

          )}</section><section class="card"><h2>復習の仕組み</h2><p class="card-sub">不正解の問題は10分後の復習対象へ。正解を重ねると1日→3日→より長い間隔へ自動調整します。</p><div class="tip">ドリル中の不正解には、同分野の別問題を最大8問まで追加して即時補強します。</div><p class="study-footnote">※間隔と優先度は本アプリ独自の簡易アルゴリズムです。期限と解答速度も出題優先度に反映します。</p></section></div>${infoFooter()}`;
      }
      function review() {
        const due = dueQuestions().sort(

        }<small style="font-size:13px">問</small></div></div></div><div class="grid g2"><section class="card"><h2>予定済みの復習</h2><p class="card-sub">期限を過ぎた問題から優先。予定が0件なら、間違えた問題を任意に復習できます。</p>${due.length ? `<div class="notice" style="margin:14px 0">先頭から最大20問を出題します。正答すると次の復習日が更新されます。</div><button class="btn primary full" data-action="start" data-mode="review">▶ 復習を始める（${Math.min(20, due.length)}問）</button>` : `<div class="empty" style="margin:16px 0"><strong>期限到来の問題はありません</strong>現在の復習予定はすべて完了しています。</div>`}<button class="btn full" data-action="start" data-mode="mistakes" ${wrong.length ? "" : "disabled"} style="margin-top:10px">過去の誤答から再挑戦</button></section><section class="card"><h2>直近の誤答</h2>${

      function mock() {

      }
      function analytics() {
        const s = profileStats(),
          weak = weakCategories();

              label: `${d.getMonth() + 1}/${d.getDate()}`,

        return `${heading("学習分析", "弱点は正答率、学習量は既習問題数、習熟は反復の履歴で区別して評価します。", "PERFORMANCE ANALYTICS")}<div class="grid g4" style="margin-bottom:16px"><div class="card slim"><div class="stat-label">累計回答</div><div class="stat">${s.answers}</div></div><div class="card slim"><div class="stat-label">累計正答率</div><div class="stat">${s.answers ? s.accuracy + "%" : "—"}</div></div><div class="card slim"><div class="stat-label">問題カバー率</div><div class="stat">${round((s.seen / QS.length) * 100)}%</div></div><div class="card slim"><div class="stat-label">連続達成模試</div><div class="stat">${mockStreak()}回</div></div></div><div class="grid g2"><section class="card"><h2>過去7日間の回答数</h2><div class="chart">${days.map((d) => `<div class="chartcol"><span>${d.count}</span><div class="chartbar" style="height:${Math.max(3, Math.round((d.count / max) * 128))}px"></div><small>${d.label}</small></div>`).join("")}</div></section><section class="card"><h2>次の学習優先度</h2><p class="card-sub">未学習領域と、正答率の低い分野を優先します。</p><div class="bar-list">${weak
          .slice(0, 6)
          .map((c) => barRow(c.name, c.accuracy))
          .join(
            "",
          )}</div></section></div><section class="card" style="margin-top:16px"><div class="sec-title"><h2>分野別習熟</h2><span class="chip">${CATS.length}分野</span></div><div class="table-wrap"><table class="table"><thead><tr><th>分野</th><th>学習済</th><th>回答回数</th><th>正答率</th><th>次の演習</th></tr></thead><tbody>${CATS.map(
          (c) => {

            return `<tr><td><strong>${h(c.name)}</strong></td><td>${a.seen}/${a.total}</td><td>${a.answers}</td><td><span class="pill ${a.accuracy !== null && a.accuracy >= 85 ? "good" : a.accuracy !== null && a.accuracy < 60 ? "danger" : ""}">${a.accuracy === null ? "未測定" : a.accuracy + "%"}</span></td><td><button class="btn small" data-action="start" data-mode="focus" data-cat="${c.id}">演習</button></td></tr>`;
          },
        ).join(
          "",
        )}</tbody></table></div></section><section class="card" style="margin-top:16px"><h2>最近のセッション</h2>${sessions.length ? `<div class="table-wrap"><table class="table"><thead><tr><th>日時</th><th>種類</th><th>回答</th><th>正答率</th><th>所要時間</th></tr></thead><tbody>${sessions.map((x) => `<tr><td>${shortDate(x.at)} ${new Date(x.at).toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" })}</td><td>${h(modeName(x.mode))}</td><td>${x.answered}/${x.total}</td><td>${x.percent}%</td><td>${fmtSec(x.elapsed)}</td></tr>`).join("")}</tbody></table></div>` : '<div class="empty"><strong>演習履歴がありません</strong>初回演習が終了すると記録されます。</div>'}</section>${infoFooter()}`;
      }
      function settings() {
        return `${heading("学習設定とデータ管理", "学習履歴は安全に管理されます。", " SETTINGS")}<section class="card" style="max-width:850px"><h2>学習ルーティン</h2><div class="controls" style="margin:20px 0"><label class="field">1日の目標回答数<select id="daily-target">${[20, 40, 60, 80, 100].map((n) => `<option ${state.settings.dailyTarget === n ? "selected" : ""} value="${n}">${n}問</option>`).join("")}</select></label><label class="field">誤答直後の追加問題<select id="auto-reinforce"><option value="on" ${state.settings.autoReinforce ? "selected" : ""}>オン（最大8問）</option><option value="off" ${!state.settings.autoReinforce ? "selected" : ""}>オフ</option></select></label><button class="btn primary" data-action="save-settings">保存</button></div><div class="notice">復習の初回間隔：不正解 → 10分後／正解 → 1日後。連続正解で間隔が延長されます。</div></section><section class="card" style="max-width:850px;margin-top:16px"><h2>バックアップ・復元</h2><p class="card-sub">進捗は同じブラウザ内で自動保存。閲覧履歴削除や別端末への移行に備えてバックアップできます。</p><div class="inline-actions" style="margin:18px 0"><button class="btn primary" data-action="export">JSONで書き出す</button><label class="btn" for="import-file" style="cursor:pointer">JSONを読み込む</label><input type="file" id="import-file" accept=".json,application/json" style="display:none"></div><p class="study-footnote">読み込みは現在の学習履歴を置き換えます。取り込めるのはこのアプリで書き出したデータ形式です。</p></section><section class="card" style="max-width:850px;margin-top:16px"><h2>全データ削除</h2><p class="card-sub">初期状態へ戻します。この操作は元に戻せません。</p><button class="btn danger" data-action="reset">すべての学習履歴を削除</button></section>${infoFooter()}`;
      }
      function modeName(m) {
        return (
          {
            sprint: "5分スプリント",
            intensive: "集中20問",
            weak: "弱点集中",
            focus: "分野別演習",
            review: "期限復習",
            mistakes: "誤答リトライ",
            mock: "実戦模試",
          }[m] || m
        );
      }
      function instantiate(q) {
        const ids = shuffle([0, 1, 2, 3]);
        return {
          ...q,
          choices: ids.map((i) => q.choices[i]),
          answer: ids.indexOf(q.answer),
        };
      }
      function pickByScore(arr, num, kind = "drill") {
        const now = Date.now(),
          cache = {};
        const pool = arr
          .map((q) => {
            const p = pOf(q.id);
            const c = cache[q.cat] || (cache[q.cat] = categoryStats(q.cat));
            const errorRate = p && p.seen ? p.wrong / p.seen : 0;
            const speedPenalty = p
              ? Math.min(23, Math.max(0, (p.avgMs - 12000) / 1800))
              : 0;
            let score =
              Math.random() * 18 +
              (p ? 0 : 45) +
              errorRate * 65 +
              (p && p.due <= now ? 32 : 0) +
              speedPenalty +
              (c.accuracy !== null ? Math.max(0, 85 - c.accuracy) * 0.65 : 12);
            if (kind === "mock") score = Math.random() * 65 + (p ? 0 : 15);
            return { q, score };
          })
          .sort((a, b) => b.score - a.score);
        return pool.slice(0, Math.min(num, pool.length)).map((x) => x.q);
      }
      function balancedMock(n) {
        const grammar = QS.filter((q) => CAT[q.cat].group === "文法"),
          vocab = QS.filter((q) => CAT[q.cat].group === "語彙"),
          reading = QS.filter((q) => CAT[q.cat].group === "読解");
        const gr = Math.round(n * 0.65),
          vo = Math.round(n * 0.2),
          re = n - gr - vo;
        const usedPassages = new Set(),
          rs = [];
        for (const q of shuffle(reading)) {
          if (!usedPassages.has(q.passage)) {
            rs.push(q);
            usedPassages.add(q.passage);
          }
          if (rs.length >= re) break;
        }
        return shuffle([
          ...pickByScore(grammar, gr, "mock"),
          ...pickByScore(vocab, vo, "mock"),
          ...rs,
        ]);
      }
      function plannedQuestions(mode, cat, count) {
        if (mode === "review")
          return dueQuestions()
            .sort((a, b) => pOf(a.id).due - pOf(b.id).due)
            .slice(0, 20);
        if (mode === "mistakes")
          return pickByScore(
            wrongQuestions(),
            Math.min(20, wrongQuestions().length),
          );
        if (mode === "mock") return balancedMock(count || 30);
        let arr = cat ? QS.filter((q) => q.cat === cat) : QS;
        if (mode === "weak") {
          const weak = weakCategories()
            .slice(0, 5)
            .map((c) => c.id);
          arr = QS.filter((q) => weak.includes(q.cat));
        }
        return pickByScore(
          arr,
          count ||
            { sprint: 10, intensive: 20, weak: 12, focus: 12 }[mode] ||
            12,
        );
      }
      function startSession(mode, cat = null, count = null, time = null) {
        if (session) {
          showConfirm(
            "現在の演習を終了して、新しい演習を開始しますか？",
            () => {
              finishSession(true);
              doStart(mode, cat, count, time);
            },
          );
        } else doStart(mode, cat, count, time);
      }
      function doStart(mode, cat, count, time) {
        const planned = plannedQuestions(mode, cat, count);
        if (!planned.length) {
          toast("出題できる問題がありません。");
          return;
        }
        const limit =
          Number(time) ||
          (mode === "mock"
            ? 20
            : mode === "sprint"
              ? 5
              : mode === "intensive"
                ? 12
                : mode === "weak"
                  ? 8
                  : mode === "focus"
                    ? 8
                    : mode === "review"
                      ? 15
                      : 12);
        session = {
          mode,
          list: planned.map(instantiate),
          idx: 0,
          correct: 0,
          answered: 0,
          started: Date.now(),
          questionStarted: Date.now(),
          timeLimit: limit * 60,
          attempts: [],
          selected: null,
          reinforcement: 0,
          finished: false,
        };
        lastResult = null;
        view = "play";
        startTicker();
        render();
        window.scrollTo({ top: 0, behavior: "instant" });
      }
      function startTicker() {
        clearInterval(ticker);
        ticker = setInterval(() => {
          if (!session) return;
          const elapsed = (Date.now() - session.started) / 1000,
            left = session.timeLimit - elapsed;
          if (left <= 0) {
            finishSession(false);
            toast("制限時間になりました。自動採点しました。");
            return;
          }
          const el = document.getElementById("live-timer");
          if (el) {
            el.textContent = fmtSec(left);
            el.classList.toggle("urgent", left <= 60);
          }
        }, 500);
      }
      function choose(index) {
        if (!session || session.finished || session.selected !== null) return;
        const q = session.list[session.idx];
        if (!q) return;
        const ok = index === q.answer,
          ms = Date.now() - session.questionStarted;
        session.selected = index;
        session.correct += ok ? 1 : 0;
        session.answered++;
        session.attempts.push({
          id: q.id,
          cat: q.cat,
          stem: q.stem,
          chosen: index,
          correct: ok,
          answer: q.choices[q.answer],
          chosenText: index >= 0 ? q.choices[index] : "（未回答）",
          explanation: q.explanation,
          timeMs: ms,
        });
        profileUpdate(q, ok, ms);
        if (
          !ok &&
          session.mode !== "mock" &&
          session.mode !== "review" &&
          session.mode !== "mistakes" &&
          state.settings.autoReinforce &&
          session.reinforcement < 8
        ) {
          let used = new Set(session.list.map((x) => x.id));
          const candidate = pickByScore(
            QS.filter((x) => x.cat === q.cat && !used.has(x.id)),
            1,
          );
          if (candidate.length) {
            session.list.splice(
              Math.min(session.list.length, session.idx + 3),
              0,
              instantiate(candidate[0]),
            );
            session.reinforcement++;
          }
        }
        renderPlay();
        const nextButton = document.querySelector('[data-action="next"]');
        if (nextButton) {
          nextButton.focus({ preventScroll: true });
          const feedback = document.getElementById("answer-feedback");
          if (
            feedback &&
            feedback.getBoundingClientRect().top > window.innerHeight - 130
          )
            feedback.scrollIntoView({
              behavior: window.matchMedia("(prefers-reduced-motion: reduce)")
                .matches

                : "smooth",

      function nextQuestion() {

      function finishSession(aborted = false) {
        if (!session) return;
        clearInterval(ticker);
        const ended = Date.now(),
          s = session;
        const total = s.list.length,
          answered = s.answered,

        window.scrollTo({ top: 0, behavior: "instant" });
      }
      function progressPlay() {
        const s = session;

      }
      function renderPlay() {
        if (!session) return;
        document.body.classList.add("is-playing");
        const s = session,
          q = s.list[s.idx];
        const remaining = s.timeLimit - (Date.now() - s.started) / 1000;
        const mock = s.mode === "mock",
          answered = s.selected !== null;
        document.getElementById("content").innerHTML =
          `<div class="session-wrap"><div class="session-top"><div><span class="eyebrow">${h(modeName(s.mode))}</span><div style="font-weight:850;font-size:16px">${s.idx + 1} <span class="muted">/ ${s.list.length} 問</span></div></div><div class="inline-actions"><span class="pill ${mock ? "warn" : "good"}">${mock ? "模試：解説は終了後" : "解答後に解説"}</span><span class="timer ${remaining <= 60 ? "urgent" : ""}" id="live-timer" role="timer">${fmtSec(remaining)}</span></div></div><div class="progress-wide" role="progressbar" aria-label="演習の進行状況" aria-valuemin="0" aria-valuemax="${s.list.length}" aria-valuenow="${s.idx + (answered ? 1 : 0)}"><div style="width:${((s.idx + (answered ? 1 : 0)) / s.list.length) * 100}%"></div></div><section class="card q-card" aria-labelledby="question"><div class="q-meta"><span class="chip">${h(CAT[q.cat].name)}</span><span class="chip level${q.level}">Lv.${q.level}</span>${s.reinforcement ? `<span class="chip">追加補強 ${s.reinforcement}問</span>` : ""}</div>${q.passage ? `<div class="passage">${h(q.passage)}</div>` : ""}<div class="question" id="question" aria-live="polite">${h(q.stem)}</div><div class="options">${q.choices.map((opt, i) => `<button class="option ${answered && i === q.answer && !mock ? "correct" : ""} ${answered && i === s.selected && i !== q.answer && !mock ? "incorrect" : ""} ${answered && i === s.selected && mock ? "selected" : ""}" data-action="choose" data-choice="${i}" ${answered ? "disabled" : ""}><span class="letter">${String.fromCharCode(65 + i)}</span><span>${h(opt)}</span></button>`).join("")}</div>${answered && !mock ? `<div id="answer-feedback" class="answer-feedback ${s.selected === q.answer ? "" : "bad"}" role="status" aria-live="polite"><div class="feedback-title">${s.selected === q.answer ? "✓ 正解：根拠を確認" : "× 不正解：ここだけ覚える"}</div><div class="feedback-desc"><strong>正解：${h(q.choices[q.answer])}</strong><div>${h(q.explanation)}</div></div></div>` : ""}${answered && mock ? `<div class="notice" style="margin-top:13px">回答を記録しました。正答・解説は模試終了後に表示します。</div>` : ""}<div class="q-bottom"><span class="qhint">${answered ? `正解数：${s.correct} / ${s.answered}` : "数字キー 1〜4 で選択"} ${!mock && answered ? ` · <span class="kbd">Enter</span> 次へ` : ""}</span><div class="inline-actions"><button class="btn small ghost" data-action="stop">終了して採点</button>${answered ? `<button class="btn primary" data-action="next">${s.idx === s.list.length - 1 ? "結果を見る" : "次の問題 →"}</button>` : `<button class="btn small" data-action="skip">わからない</button>`}</div></div></section></div>`;
        renderShell();
      }
      function result() {
        const x = lastResult;
        if (!x) return home();
        const missed = x.attempts.filter((a) => !a.correct);
        const missing = x.total - x.answered;
        const avg = x.answered
          ? round(
              x.attempts.reduce((a, b) => a + b.timeMs, 0) / x.answered / 1000,
            )
          : 0;
        const catCounts = {};
        for (const a of x.attempts) {
          const z = catCounts[a.cat] || { num: 0, correct: 0 };
          z.num++;
          if (a.correct) z.correct++;
          catCounts[a.cat] = z;
        }
        return `${heading(x.aborted ? "途中終了の結果" : "演習結果", "正答率だけでなく、間違えた理由と必要な復習を確認します。", "SESSION / REVIEW")}<div class="card" style="max-width:920px"><div class="inline-actions"><span class="chip">${h(modeName(x.mode))}</span><span class="chip">${x.answered}問回答 / ${x.total}問</span><span class="chip">${fmtSec(x.elapsed)}</span></div><div class="result-score"><div class="big ${x.percent < 75 ? "low" : ""}">${x.percent}%</div><div><h2>${x.percent >= 85 ? "目標ラインに到達" : x.percent >= 65 ? "改善の余地あり" : "基礎を優先して補強"}</h2><p class="card-sub">正解 ${x.correct} / 全${x.total}問 · 平均回答 ${avg}秒${missing ? ` · 未回答 ${missing}問` : ""}</p><span class="pill ${x.percent >= 85 ? "good" : "warn"}">訓練目標：85%（公式基準ではありません）</span></div></div><div class="actions"><button class="btn primary" data-action="retry-misses" ${missed.length ? "" : "disabled"}>誤答をすぐ復習（${missed.length}問）</button><button class="btn" data-action="start" data-mode="weak">弱点12問を解く</button><button class="btn" data-action="nav" data-view="analytics">分析を見る</button></div><h2 style="margin-top:27px">今回の分野別結果</h2><div class="bar-list">${Object.entries(
          catCounts,
        )
          .map(([id, c]) =>
            barRow(CAT[id].name, round((c.correct / c.num) * 100)),
          )
          .join(
            "",
          )}</div><h2 style="margin:27px 0 13px">見直し${missed.length ? `：誤答 ${missed.length}問` : "：全問正答"}</h2>${missed.length ? `<div class="result-list">${missed.map((a, i) => `<div class="result-item"><span class="chip">${h(CAT[a.cat].name)}</span><span class="chip">#${i + 1}</span><div class="result-stem">${h(a.stem)}</div><div class="answerline"><span class="warning">回答：${h(a.chosenText)}</span><br><span class="highlight">正解：${h(a.answer)}</span></div><div class="explain">${h(a.explanation)}</div></div>`).join("")}</div>` : '<div class="tip">誤答はありません。時間を短くするか、難易度の高い分野に挑戦してください。</div>'}${missing ? `<div class="notice" style="margin-top:14px">未回答：${missing}問。未回答問題は成績の分母に含みますが、個別の誤答履歴には登録していません。</div>` : ""}</div>${infoFooter()}`;
      }
      function retryMisses() {
        if (!lastResult) return;
        const qs = lastResult.attempts
          .filter((a) => !a.correct)
          .map((a) => QS.find((q) => q.id === a.id))
          .filter(Boolean);
        if (!qs.length) return;
        const planned = qs.map(instantiate);
        if (session) return;
        session = {
          mode: "mistakes",
          list: planned,
          idx: 0,
          correct: 0,
          answered: 0,
          started: Date.now(),
          questionStarted: Date.now(),
          timeLimit: Math.max(5, qs.length) * 90,
          attempts: [],
          selected: null,
          reinforcement: 0,
          finished: false,
        };
        view = "play";
        startTicker();
        render();
      }
      function render() {
        document.body.classList.toggle("is-playing", view === "play");
        renderShell();
        document.getElementById("content").innerHTML =
          {
            home,
            learn,
            drill,
            review,
            mock,
            analytics,
            settings,
            play: () => "",
            result,
          }[view]?.() || home();
        if (view === "play") renderPlay();
      }
      function showConfirm(message, yes) {
        const root = document.getElementById("modal-root"),
          before = document.activeElement;
        root.innerHTML = `<div class="modal"><div class="modalbox" role="dialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-desc"><h2 id="confirm-title">確認</h2><p id="confirm-desc">${h(message)}</p><div class="modal-actions"><button class="btn" data-modal="cancel">キャンセル</button><button class="btn danger" data-modal="confirm">続行</button></div></div></div>`;
        const handler = (e) => {
          const b = e.target.closest("[data-modal]");
          if (!b) return;
          root.removeEventListener("click", handler);
          root.innerHTML = "";
          if (b.dataset.modal === "confirm") yes();
          else if (before?.isConnected) before.focus();
        };
        root.addEventListener("click", handler);
        root.querySelector('[data-modal="cancel"]')?.focus();
      }
      function exportData() {
        const payload = {
            app: "DCR English Lab",
            version: 1,
            exportedAt: new Date().toISOString(),
            data: state,
          },
          blob = new Blob([JSON.stringify(payload, null, 2)], {
            type: "application/json",
          }),
          u = URL.createObjectURL(blob),
          a = document.createElement("a");
        a.href = u;
        a.download = `dcr-english-progress-${localDate(Date.now())}.json`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(u), 2000);
        toast("学習データを書き出しました。");
      }
      async function importData(file) {
        if (!file) return;
        try {
          if (file.size > 3_000_000) throw Error("ファイルが大きすぎます。");
          const raw = JSON.parse(await file.text());
          if (
            raw.app !== "DCR English Lab" ||
            raw.version !== 1 ||
            !raw.data ||
            typeof raw.data.profiles !== "object" ||
            !Array.isArray(raw.data.sessions)
          )
            throw Error("対応するバックアップ形式ではありません。");
          const allowed = new Set(QS.map((q) => q.id)),
            profiles = {};
          for (const [key, v] of Object.entries(raw.data.profiles)) {
            if (!allowed.has(key) || !v || typeof v !== "object") continue;
            const clean = { ...v };
            for (const f of [
              "seen",
              "correct",
              "wrong",
              "streak",
              "ease",
              "interval",
              "due",
              "avgMs",
              "last",
            ])
              clean[f] = Number(v[f]) || 0;
            clean.byDay =
              v.byDay && typeof v.byDay === "object"
                ? Object.fromEntries(
                    Object.entries(v.byDay)
                      .filter(
                        ([k, z]) =>
                          /^\d{4}-\d{2}-\d{2}$/.test(k) &&
                          Number.isFinite(Number(z)),
                      )
                      .map(([k, z]) => [k, Math.max(0, Number(z))]),
                  )
                : {};
            profiles[key] = clean;
          }
          const ss = raw.data.sessions
            .filter(
              (v) =>
                v && typeof v === "object" && Number.isFinite(Number(v.at)),
            )
            .slice(-150)
            .map((v) => ({
              mode: [
                "sprint",
                "intensive",
                "weak",
                "focus",
                "review",
                "mistakes",
                "mock",
              ].includes(v.mode)
                ? v.mode
                : "focus",
              at: Number(v.at) || 0,
              total: Math.max(0, Number(v.total) || 0),
              answered: Math.max(0, Number(v.answered) || 0),
              correct: Math.max(0, Number(v.correct) || 0),
              percent: Math.max(0, Math.min(100, Number(v.percent) || 0)),
              elapsed: Math.max(0, Number(v.elapsed) || 0),
              aborted: !!v.aborted,
            }));
          const cfg = raw.data.settings || {};
          const safeSettings = {
            dailyTarget: [20, 40, 60, 80, 100].includes(Number(cfg.dailyTarget))
              ? Number(cfg.dailyTarget)
              : 40,
            autoReinforce: cfg.autoReinforce !== false,
          };
          showConfirm(
            `既存の学習履歴を上書きして、${Object.keys(profiles).length}問分のデータを復元しますか？`,
            () => {
              state = {
                ...defaults(),
                profiles,
                sessions: ss,
                settings: safeSettings,
              };
              persist();
              render();
              toast("学習履歴を復元しました。");
            },
          );
        } catch (e) {
          toast(`読み込み失敗：${e.message}`);
        }
      }
      function resetAll() {
        showConfirm(
          "学習記録・正答率・復習予定をすべて削除します。バックアップ済みであることをご確認ください。",
          () => {
            state = defaults();
            lastResult = null;
            session = null;
            clearInterval(ticker);
            persist();
            navTo("home");
            toast("学習履歴を初期化しました。");
          },
        );
      }
      document.addEventListener("click", (e) => {
        const b = e.target.closest("[data-action]");
        if (!b) return;
        const a = b.dataset.action;
        switch (a) {
          case "nav":
            closeMore();
            navTo(b.dataset.view);
            break;
          case "more-open":
            openMore();
            break;
          case "more-close":
            if (e.target === b || b.tagName === "BUTTON") closeMore();
            break;
          case "lesson-filter":
            lessonFilter = b.dataset.filter;
            selectedCategory = null;
            render();
            break;
          case "lesson-open":
            selectedCategory = b.dataset.cat;
            render();
            document
              .getElementById("lesson")
              ?.scrollIntoView({ behavior: "smooth", block: "start" });
            break;
          case "lesson-close":
            selectedCategory = null;
            render();
            break;
          case "start":
            startSession(b.dataset.mode, b.dataset.cat || null, null, null);
            break;
          case "start-focus-select":
            startSession(
              "focus",
              document.getElementById("focus-cat").value,
              +document.getElementById("focus-count").value,
              null,
            );
            break;
          case "start-mock":
            startSession(
              "mock",
              null,
              +document.getElementById("mock-count").value,
              +document.getElementById("mock-time").value,
            );
            break;
          case "choose":
            choose(+b.dataset.choice);
            break;
          case "skip":
            choose(-1);
            break;
          case "next":
            nextQuestion();
            break;
          case "stop":
            showConfirm("現在の回答までで採点し、演習を終了しますか？", () =>
              finishSession(true),
            );
            break;
          case "retry-misses":
            retryMisses();
            break;
          case "export":
            exportData();
            break;
          case "save-settings":
            state.settings.dailyTarget =
              +document.getElementById("daily-target").value;
            state.settings.autoReinforce =
              document.getElementById("auto-reinforce").value === "on";
            persist();
            render();
            toast("設定を保存しました。");
            break;
          case "reset":
            resetAll();
            break;
        }
      });
      document.addEventListener("change", (e) => {
        if (e.target.id === "import-file") {
          importData(e.target.files?.[0]);
          e.target.value = "";
        }
      });
      document.addEventListener("keydown", (e) => {
        if (
          !session ||
          view !== "play" ||
          e.altKey ||
          e.ctrlKey ||
          e.metaKey ||
          document.querySelector("#modal-root .modal")
        )
          return;
        if (
          ["INPUT", "TEXTAREA", "SELECT"].includes(
            document.activeElement?.tagName,
          )
        )
          return;
        if (["1", "2", "3", "4"].includes(e.key) && session.selected === null) {
          choose(Number(e.key) - 1);
          e.preventDefault();
        }
        if (
          e.key === "Enter" &&
          session.selected !== null &&
          !document.activeElement?.closest("button, a, [role=button]")
        ) {
          nextQuestion();
          e.preventDefault();
        }
      });
      document.addEventListener("keydown", (e) => {
        if (e.key !== "Escape") return;
        if (document.getElementById("mobile-more")) {
          closeMore();
          e.preventDefault();
          return;
        }
        const cancel = document.querySelector(
          '#modal-root [data-modal="cancel"]',
        );
        if (cancel) {
          cancel.click();
          e.preventDefault();
        }
      });
      window.addEventListener("beforeunload", () => {
        if (session) persist();
      });
      render();
    </script>
  </body>
</html>
